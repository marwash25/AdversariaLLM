defaults:
  - attacks: attacks
  - datasets: datasets
  - models: models
  - paths
  - override hydra/launcher: mila_a100.yaml # use to run batch job on Mila's cluster
  - _self_

hydra:
  # mode: MULTIRUN
  # sweeper:
  #   params:
  #     attacks.dsm.dca_config.dual_cone_config.solver_configs.pgm.sort_epsilon: 0.0,1e-4,1e-3,1e-2,1e-1,1.0
  #     attacks.dsm.dca_config.dual_cone_config.solver_configs.pgm.min_epsilon: 0.0,1e-4,1e-3,1e-2,1e-1,1.0
  run:
    dir: ${root_dir}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}/
  job:
    chdir: true
    env_set:
      PYTHONOPTIMIZE: "1" # to disable asserts
  sweep:
    dir: ${root_dir}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}/

# automatically select models based on attack_name
slurm_copy_hf_cache: null

name: testing
save_dir: ${root_dir}/outputs/${name}/${attack}/results/  # place to store results
embed_dir: ${root_dir}/outputs/${name}/${attack}/embeddings/  # place to store embeddings
overwrite: false
save_format: "noDB"  # noDB or default; noDB optimized for human readability instead of programatic database use
use_database: false  # Set to true to enable MongoDB

classifiers: ["strong_reject"]  # anything from judgezoo

# Top-level generation config for easier overriding
generation_config:
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 256
  num_return_sequences: 1


attack: dsm
dataset: adv_behaviors
datasets:
  adv_behaviors:
    idx: 0 #[0,1] # using "range(0,2)" will not work because code only accepts strings that start with "list(range("; see prompt_dataset.py
model: meta-llama/Llama-3.2-1B-Instruct 
#hydra.launcher.timeout_min: 240